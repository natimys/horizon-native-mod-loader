[package]
name = "horizon-native-pack"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
horizon-native-runtime = { path = "../runtime" }
horizon-native-hello-mod = { path = "../mods/hello" }
horizon-native-companion-mod = { path = "../mods/companion", optional = true }

horizon-native-workshop-mod = { path = "../mods/workshop", optional = true }

[features]
gameplay-example = ["dep:horizon-native-workshop-mod"]
test-pack = ["dep:horizon-native-companion-mod"]

[dev-dependencies]
horizon-native-api = { path = "../api" }
